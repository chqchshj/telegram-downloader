<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Downloader Config</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f4;
      color: #202124;
    }
    body {
      margin: 0;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid #d8d8d0;
      background: #ffffff;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      gap: 18px;
    }
    section {
      background: #ffffff;
      border: 1px solid #d8d8d0;
      border-radius: 8px;
      padding: 18px;
    }
    h1, h2 {
      margin: 0;
      letter-spacing: 0;
    }
    h1 {
      font-size: 22px;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    label {
      display: grid;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
    }
    input, textarea, select, button {
      font: inherit;
      box-sizing: border-box;
    }
    input, textarea, select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #bfc3bd;
      border-radius: 6px;
      background: #ffffff;
      color: #202124;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button {
      border: 1px solid #276749;
      background: #2f855a;
      color: white;
      border-radius: 6px;
      padding: 9px 13px;
      cursor: pointer;
      font-weight: 650;
    }
    button.secondary {
      background: #ffffff;
      color: #276749;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .check input {
      width: auto;
    }
    .notice {
      padding: 10px 12px;
      border-radius: 6px;
      background: #fff8db;
      border: 1px solid #ead88b;
      font-size: 13px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f1f3f2;
      padding: 12px;
      border-radius: 6px;
      min-height: 54px;
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #151715; color: #eceee9; }
      header, section { background: #20231f; border-color: #3b4038; }
      input, textarea, select { background: #151715; color: #eceee9; border-color: #596055; }
      button.secondary { background: #20231f; color: #a9f0c8; }
      .notice { background: #403914; border-color: #7c6b23; }
      pre { background: #151715; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Telegram Downloader Config</h1>
  </header>
  <main>
    <section id="warnings"></section>

    <section>
      <h2>Access</h2>
      <div class="grid">
        <label>Web token
          <input id="webToken" type="password" autocomplete="off" placeholder="TDL_WEB_TOKEN if configured">
        </label>
      </div>
    </section>

    <section>
      <h2>Telegram</h2>
      <div class="grid">
        <label>API ID <input id="apiId" type="number" min="1"></label>
        <label>API Hash <input id="apiHash" type="password" autocomplete="off" placeholder="Leave blank to keep existing"></label>
        <label>Phone <input id="phoneNumber" type="text" autocomplete="off" placeholder="+1234567890"></label>
        <label>Download directory <input id="downloadDir" type="text" placeholder="/downloads"></label>
      </div>
    </section>

    <section>
      <h2>Sources</h2>
      <label>One source per line: URL or chat_id, optional name after a comma
        <textarea id="sources" spellcheck="false" placeholder="https://t.me/example_channel, Example"></textarea>
      </label>
    </section>

    <section>
      <h2>Filters</h2>
      <div class="grid">
        <label>Extensions <input id="extensions" type="text" placeholder=".mp4,.jpg,.jpeg,.png,.webp"></label>
        <label>Only after <input id="onlyAfter" type="text" placeholder="2026-06-18T00:00:00+08:00"></label>
        <label>Only before <input id="onlyBefore" type="text" placeholder="2026-07-01T00:00:00+08:00"></label>
      </div>
    </section>

    <section>
      <h2>Daemon And Storage</h2>
      <div class="grid">
        <label>Daemon interval seconds <input id="daemonInterval" type="number" min="60" max="86400"></label>
        <label class="check"><input id="daemonEnabled" type="checkbox"> Daemon enabled</label>
        <label class="check"><input id="flatStructure" type="checkbox"> Flat structure</label>
      </div>
    </section>

    <section>
      <h2>Proxy</h2>
      <div class="grid">
        <label class="check"><input id="proxyEnabled" type="checkbox"> Proxy enabled</label>
        <label>Scheme
          <select id="proxyScheme">
            <option value="socks5">socks5</option>
            <option value="http">http</option>
          </select>
        </label>
        <label>Host <input id="proxyHost" type="text" placeholder="192.168.2.20"></label>
        <label>Port <input id="proxyPort" type="number" min="1" max="65535" placeholder="40000"></label>
        <label>Username <input id="proxyUsername" type="text" autocomplete="off"></label>
        <label>Password <input id="proxyPassword" type="password" autocomplete="off" placeholder="Leave blank to keep existing"></label>
      </div>
    </section>

    <section>
      <div class="row">
        <button id="saveBtn">Save config</button>
        <button id="reloadBtn" class="secondary">Reload</button>
        <button id="statusBtn" class="secondary">Refresh status</button>
      </div>
      <pre id="result"></pre>
    </section>

    <section>
      <h2>Status</h2>
      <pre id="status"></pre>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentConfig = {};

    function headers() {
      const token = $("webToken").value.trim();
      const h = {"Content-Type": "application/json"};
      if (token) h.Authorization = `Bearer ${token}`;
      return h;
    }

    function show(id, value) {
      $(id).textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    function fillForm(config) {
      currentConfig = config || {};
      $("apiId").value = currentConfig.api_id || "";
      $("apiHash").value = "";
      $("phoneNumber").value = currentConfig.phone_number || "";
      $("downloadDir").value = currentConfig.download_dir || "/downloads";
      $("flatStructure").checked = Boolean(currentConfig.flat_structure);

      const filters = currentConfig.global_filters || {};
      $("extensions").value = (filters.extensions || []).join(",");
      $("onlyAfter").value = filters.only_after || "";
      $("onlyBefore").value = filters.only_before || "";

      const daemon = currentConfig.daemon || {};
      $("daemonEnabled").checked = Boolean(daemon.enabled);
      $("daemonInterval").value = daemon.check_interval || 300;

      const proxy = currentConfig.proxy || {};
      $("proxyEnabled").checked = Boolean(proxy.enabled);
      $("proxyScheme").value = proxy.scheme || "socks5";
      $("proxyHost").value = proxy.host || proxy.hostname || "";
      $("proxyPort").value = proxy.port || "";
      $("proxyUsername").value = proxy.username || "";
      $("proxyPassword").value = "";

      $("sources").value = (currentConfig.sources || []).map((source) => {
        const id = source.url || source.chat_id || "";
        return source.name ? `${id}, ${source.name}` : String(id);
      }).join("\n");
    }

    function parseSources() {
      return $("sources").value.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
        const [id, ...nameParts] = line.split(",");
        const value = id.trim();
        const source = {};
        if (/^-?\d+$/.test(value)) source.chat_id = Number(value);
        else source.url = value;
        const name = nameParts.join(",").trim();
        if (name) source.name = name;
        return source;
      });
    }

    function buildPayload() {
      const payload = {...currentConfig};
      payload.api_id = Number($("apiId").value);
      if ($("apiHash").value.trim()) payload.api_hash = $("apiHash").value.trim();
      else if (!payload.api_hash) payload.api_hash = "";
      payload.phone_number = $("phoneNumber").value.trim() || null;
      payload.download_dir = $("downloadDir").value.trim() || "/downloads";
      payload.flat_structure = $("flatStructure").checked;
      payload.sources = parseSources();
      payload.global_filters = {
        ...(payload.global_filters || {}),
        extensions: $("extensions").value.split(",").map((v) => v.trim()).filter(Boolean),
        only_after: $("onlyAfter").value.trim() || null,
        only_before: $("onlyBefore").value.trim() || null,
      };
      payload.daemon = {
        ...(payload.daemon || {}),
        enabled: $("daemonEnabled").checked,
        check_interval: Number($("daemonInterval").value || 300),
      };
      payload.proxy = {
        ...(payload.proxy || {}),
        enabled: $("proxyEnabled").checked,
        scheme: $("proxyScheme").value,
        host: $("proxyHost").value.trim() || null,
        port: $("proxyPort").value ? Number($("proxyPort").value) : null,
        username: $("proxyUsername").value.trim() || null,
      };
      if ($("proxyPassword").value.trim()) payload.proxy.password = $("proxyPassword").value.trim();
      return payload;
    }

    async function loadConfig() {
      const response = await fetch("/api/config", {headers: headers()});
      const data = await response.json();
      if (!response.ok) throw new Error(JSON.stringify(data));
      fillForm(data.config || {});
      const warnings = [];
      if (!data.token_required) warnings.push("TDL_WEB_TOKEN is not set. Keep this service bound to localhost or a trusted network.");
      if (data.env_overrides && data.env_overrides.length) warnings.push(`TDL_ environment variables override YAML: ${data.env_overrides.join(", ")}`);
      $("warnings").innerHTML = warnings.map((w) => `<div class="notice">${w}</div>`).join("");
      show("result", {config_path: data.config_path});
    }

    async function saveConfig() {
      const payload = buildPayload();
      const response = await fetch("/api/config", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(JSON.stringify(data));
      fillForm(data.config || {});
      show("result", data);
    }

    async function loadStatus() {
      const response = await fetch("/api/status", {headers: headers()});
      const data = await response.json();
      if (!response.ok) throw new Error(JSON.stringify(data));
      show("status", data);
    }

    $("reloadBtn").addEventListener("click", () => loadConfig().catch((e) => show("result", String(e))));
    $("saveBtn").addEventListener("click", () => saveConfig().catch((e) => show("result", String(e))));
    $("statusBtn").addEventListener("click", () => loadStatus().catch((e) => show("status", String(e))));
    loadConfig().then(loadStatus).catch((e) => show("result", String(e)));
  </script>
</body>
</html>
